<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backdrop Studio</title>
<style>
:root{
  --bg:#0b0c10; --panel:#12141a; --panel2:#181b23; --line:#262a35; --text:#e7e9ee; --mute:#8b91a1; --accent:#7c5cff; --accent2:#22d3ee;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{display:grid;grid-template-columns:360px 1fr;height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:16px 16px 40px}
h1{font-size:16px;margin:0 0 2px;letter-spacing:.2px}
.sub{color:var(--mute);font-size:12px;margin-bottom:14px}
section{border-top:1px solid var(--line);padding:14px 0}
section h2{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--mute);margin:0 0 10px;font-weight:600}
label{display:block;color:var(--mute);font-size:12px;margin:8px 0 4px}
select,input[type=text],input[type=number],textarea{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:7px 8px;font:inherit}
textarea{font:11px/1.45 ui-monospace,Consolas,monospace;height:170px;resize:vertical}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.range{display:grid;grid-template-columns:72px 1fr 38px;gap:8px;align-items:center;margin:6px 0}
.range span{color:var(--mute);font-size:12px}
.range output{text-align:right;font-variant-numeric:tabular-nums;color:var(--text);font-size:12px}
input[type=range]{width:100%;accent-color:var(--accent)}
.check{display:flex;gap:8px;align-items:center;color:var(--text);margin:8px 0}
button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font:inherit;cursor:pointer}
button:hover{border-color:#3a4050}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.primary:hover{filter:brightness(1.1)}
button:disabled{opacity:.5;cursor:not-allowed}
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.type{padding:0;border-radius:6px;overflow:hidden;text-align:left;border:1px solid var(--line);background:#000;position:relative}
.type canvas{display:block;width:100%;aspect-ratio:16/9}
.type b{position:absolute;left:0;right:0;bottom:0;font-size:10px;font-weight:600;padding:12px 5px 4px;background:linear-gradient(transparent,rgba(0,0,0,.85));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.type.on{outline:2px solid var(--accent);outline-offset:1px}
.themes{display:flex;flex-wrap:wrap;gap:6px}
.theme{display:flex;gap:0;padding:3px;border-radius:6px;align-items:center}
.theme i{width:12px;height:18px;display:block}
.theme i:first-child{border-radius:3px 0 0 3px}.theme i:last-child{border-radius:0 3px 3px 0}
.theme.on{outline:2px solid var(--accent)}
.swatches{display:flex;height:18px;border-radius:4px;overflow:hidden;margin-top:10px}
.swatches i{flex:1}
.dims{color:var(--mute);font-size:12px;margin-top:6px;font-variant-numeric:tabular-nums}
main{display:flex;flex-direction:column;min-width:0}
.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;min-height:0;background:
  repeating-conic-gradient(#0e0f14 0% 25%,#0b0c10 0% 50%) 0 0/24px 24px}
#preview{box-shadow:0 10px 40px rgba(0,0,0,.6);border-radius:4px;background:#000}
.bar{display:flex;gap:10px;align-items:center;padding:10px 16px;border-top:1px solid var(--line);background:var(--panel)}
.bar .meta{color:var(--mute);font-variant-numeric:tabular-nums;margin-left:auto;font-size:12px}
.progress{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;margin-top:10px}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .15s}
.status{color:var(--mute);font-size:12px;margin-top:6px;min-height:17px;font-variant-numeric:tabular-nums}
.hidden{display:none!important}
@media (max-width:820px){.app{grid-template-columns:1fr;grid-template-rows:55vh auto;height:auto}main{order:-1;height:55vh}aside{border-right:0}}
</style>
</head>
<body>
<div class="app">
<aside>
  <h1>Backdrop Studio</h1>
  <div class="sub">Seeded motion backgrounds · Canvas 2D · MP4 / WebM / PNG export</div>

  <section>
    <h2>Output</h2>
    <div class="row">
      <div><label>Aspect ratio</label>
        <select id="aspect"><option>16:9</option><option>9:16</option><option>1:1</option><option>4:5</option><option>21:9</option><option value="custom">Custom</option></select></div>
      <div><label>Resolution</label>
        <select id="quality"><option value="1080">1080p</option><option value="1440">1440p</option><option value="2160">4K</option><option value="custom">Custom</option></select></div>
    </div>
    <div class="row hidden" id="customDims">
      <div><label>Width</label><input type="number" id="cw" min="64" max="7680" step="2"></div>
      <div><label>Height</label><input type="number" id="ch" min="64" max="7680" step="2"></div>
    </div>
    <div class="dims" id="dims"></div>
  </section>

  <section>
    <h2>Pattern</h2>
    <div class="types" id="types"></div>
  </section>

  <section>
    <h2>Color</h2>
    <label>Mode</label>
    <select id="pmode">
      <option value="theme">Preset theme</option><option value="single">Single color</option><option value="dual">Dual gradient</option>
      <option value="triadic">Triadic</option><option value="analogous">Analogous</option><option value="complementary">Complementary</option><option value="custom">Custom palette</option>
    </select>
    <div id="themeBox"><label>Theme</label><div class="themes" id="themes"></div></div>
    <div id="hueBox" class="hidden">
      <div class="range"><span>Hue</span><input type="range" id="hue" min="0" max="359"><output id="hueO"></output></div>
      <div class="range" id="hue2Row"><span>Hue 2</span><input type="range" id="hue2" min="0" max="359"><output id="hue2O"></output></div>
    </div>
    <div id="customBox" class="hidden"><label>Hex colors (comma separated)</label><input type="text" id="custom" placeholder="#ff2bd6, #00f0ff, #7a3cff"></div>
    <div class="swatches" id="swatches"></div>
    <label class="check"><input type="checkbox" id="lockPal"> Lock palette when randomizing</label>
  </section>

  <section>
    <h2>Motion</h2>
    <div class="range"><span>Speed</span><input type="range" id="speed" min="0.1" max="3" step="0.05"><output id="speedO"></output></div>
    <div class="range"><span>Density</span><input type="range" id="density" min="0.2" max="2" step="0.05"><output id="densityO"></output></div>
    <div class="range"><span>Grain</span><input type="range" id="grain" min="0" max="1" step="0.01"><output id="grainO"></output></div>
    <div class="range"><span>Vignette</span><input type="range" id="vignette" min="0" max="1" step="0.01"><output id="vignetteO"></output></div>
    <label class="check"><input type="checkbox" id="glow"> Glow (additive, no blur filters)</label>
    <div class="row" style="margin-top:8px">
      <button id="reseed" title="New seed, same pattern">New seed</button>
      <button id="chaos" class="primary" title="Randomize everything">Chaos</button>
    </div>
  </section>

  <section>
    <h2>Seed</h2>
    <textarea id="json" spellcheck="false"></textarea>
    <div class="row" style="margin-top:8px"><button id="copy">Copy</button><button id="apply">Apply JSON</button></div>
    <div class="status" id="jsonStatus"></div>
  </section>

  <section>
    <h2>Export</h2>
    <div class="row">
      <div><label>Format</label><select id="fmt">
        <option value="mp4">MP4 (H.264)</option><option value="webm">WebM (VP9)</option><option value="png-seq">PNG sequence (.zip)</option><option value="png">PNG still (current frame)</option></select></div>
    </div>
    <div class="row">
      <div><label>FPS</label><select id="fps"><option>24</option><option selected>30</option><option>60</option></select></div>
      <div><label>Duration (s)</label><input type="number" id="dur" value="10" min="1" max="600"></div>
    </div>
    <div class="row" style="margin-top:10px"><button id="render" class="primary">Render</button><button id="cancel" disabled>Cancel</button></div>
    <div class="progress"><i id="prog"></i></div>
    <div class="status" id="expStatus"></div>
  </section>
</aside>

<main>
  <div class="stage" id="stage"><canvas id="preview"></canvas></div>
  <div class="bar">
    <button id="play">Pause</button>
    <button id="restart" title="Jump to t = 0 (matches export start)">Restart</button>
    <div class="meta" id="meta"></div>
  </div>
</main>
</div>

<script type="module">
// ============================================================ utilities
const TAU = Math.PI * 2;
const mod = (a, b) => ((a % b) + b) % b;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function makeRng(seed) {
  const r = mulberry32(seed >>> 0);
  r.range = (a, b) => a + r() * (b - a);
  r.int = (a, b) => Math.floor(a + r() * (b - a + 1));
  r.pick = arr => arr[Math.floor(r() * arr.length)];
  return r;
}
const hash3 = (a, b, c) => {
  let h = (Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263) + Math.imul(c | 0, 1442695041)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return (h ^ (h >>> 16)) >>> 0;
};
function makeNoise(seed) {
  const r = mulberry32((seed ^ 0x9e3779b9) >>> 0);
  const perm = Array.from({ length: 256 }, (_, i) => i);
  for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [perm[i], perm[j]] = [perm[j], perm[i]]; }
  const p = new Uint8Array(512); for (let i = 0; i < 512; i++) p[i] = perm[i & 255];
  const vals = new Float32Array(256); for (let i = 0; i < 256; i++) vals[i] = r() * 2 - 1;
  const fade = t => t * t * t * (t * (t * 6 - 15) + 10);
  const H = (x, y, z) => vals[p[p[p[x & 255] + (y & 255)] + (z & 255)]];
  return function (x, y = 0, z = 0) {
    const X = Math.floor(x), Y = Math.floor(y), Z = Math.floor(z);
    const u = fade(x - X), v = fade(y - Y), w = fade(z - Z);
    return lerp(
      lerp(lerp(H(X, Y, Z), H(X + 1, Y, Z), u), lerp(H(X, Y + 1, Z), H(X + 1, Y + 1, Z), u), v),
      lerp(lerp(H(X, Y, Z + 1), H(X + 1, Y, Z + 1), u), lerp(H(X, Y + 1, Z + 1), H(X + 1, Y + 1, Z + 1), u), v), w);
  };
}

// ============================================================ color engine
const hexToRgb = h => { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
const rgbToHex = (r, g, b) => '#' + [r, g, b].map(v => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join('');
const rgba = (hex, a = 1) => { const [r, g, b] = hexToRgb(hex); return `rgba(${r},${g},${b},${clamp(a, 0, 1).toFixed(3)})`; };
const mixHex = (a, b, t) => { const A = hexToRgb(a), B = hexToRgb(b); return rgbToHex(lerp(A[0], B[0], t), lerp(A[1], B[1], t), lerp(A[2], B[2], t)); };
const isHex = s => /^#?([0-9a-f]{3}|[0-9a-f]{6})$/i.test(s.trim());
function hsl2hex(h, s, l) {
  h = mod(h, 360) / 360;
  const f = n => { const k = mod(n + h * 12, 12); const a = s * Math.min(l, 1 - l); return l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)); };
  return rgbToHex(f(0) * 255, f(8) * 255, f(4) * 255);
}
function hexToHsl(hex) {
  let [r, g, b] = hexToRgb(hex).map(v => v / 255);
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2; let h = 0, s = 0;
  if (mx !== mn) { const d = mx - mn; s = l > .5 ? d / (2 - mx - mn) : d / (mx + mn);
    h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; h *= 60; }
  return { h, s, l };
}
const THEMES = {
  corporate: { bg: ['#06122b', '#0b1f45'], colors: ['#1e6bff', '#3fa9ff', '#7cc4ff', '#0b4fd6', '#a8d8ff'] },
  cyberpunk: { bg: ['#0a0414', '#16062e'], colors: ['#ff2bd6', '#00f0ff', '#7a3cff', '#ff6ec7', '#2de2e6'] },
  sunset:    { bg: ['#1a0a24', '#3a1030'], colors: ['#ff7b39', '#ff3d6e', '#9b2fff', '#ffb347', '#ff5e99'] },
  ocean:     { bg: ['#021821', '#04303f'], colors: ['#00c2c7', '#0a84ff', '#2ee6d6', '#1767c4', '#7fe7ff'] },
  emerald:   { bg: ['#02140e', '#05261b'], colors: ['#10e08a', '#00d1c1', '#5cff9d', '#0a9f69', '#b6ffda'] },
  fire:      { bg: ['#140402', '#2a0804'], colors: ['#ff3b1f', '#ff8a00', '#ffd23f', '#d42a1e', '#ff5e3a'] },
  monochrome:{ bg: ['#08080a', '#18181c'], colors: ['#ffffff', '#bfc3c9', '#7d838c', '#4a4f57', '#e6e8eb'] },
  synthwave: { bg: ['#0d0221', '#261447'], colors: ['#ff2a6d', '#d300c5', '#7b2cff', '#05d9e8', '#ff6c11'] },
  gold:      { bg: ['#050402', '#140f06'], colors: ['#ffc845', '#e09b1a', '#fff1c1', '#a8700d', '#ffdb7a'] },
  neon:      { bg: ['#030308', '#0b0b18'], colors: ['#39ff14', '#ff073a', '#00e5ff', '#fff01f', '#bc13fe'] },
};
function buildPalette(pc) {
  let bg, colors;
  if (pc.mode === 'theme') { const th = THEMES[pc.theme] || THEMES.cyberpunk; bg = th.bg; colors = th.colors; }
  else if (pc.mode === 'custom') {
    colors = (pc.custom || []).filter(isHex).map(c => '#' + c.trim().replace('#', ''));
    if (!colors.length) colors = ['#ffffff'];
    const d = hexToHsl(colors[0]);
    bg = [hsl2hex(d.h, d.s * .6, .05), hsl2hex(d.h + 20, d.s * .6, .11)];
  } else {
    const H = pc.hue ?? 260, H2 = pc.hue2 ?? 320;
    const hues = { single: [H], dual: [H, H2], triadic: [H, H + 120, H + 240], analogous: [H - 30, H, H + 30], complementary: [H, H + 180] }[pc.mode] || [H];
    colors = [...hues.map(h => hsl2hex(h, .85, .58)), ...hues.map(h => hsl2hex(h + 8, .9, .74))];
    if (pc.mode === 'single') colors.push(hsl2hex(H, .75, .42), hsl2hex(H - 6, .9, .86));
    bg = [hsl2hex(H, .55, .05), hsl2hex(pc.mode === 'dual' ? H2 : H + 15, .55, .12)];
  }
  return { bg, colors, rgb: colors.map(hexToRgb), bgRgb: bg.map(hexToRgb) };
}

// ============================================================ generators
// Each make(g) returns draw(t). t is "pattern time" (seconds × speed).
// All sizes scale with g.s = min(w,h)/1080 so preview and export match.
const GEN = {};

GEN.aurora = { name: 'Aurora Waves', make(g) {
  const { ctx, w, h, rng, noise, p } = g;
  const n = Math.round(3 + 2 * p.density), steps = 360, sw = w / steps;
  const bands = Array.from({ length: n }, (_, i) => {
    const th = h * rng.range(.16, .34), col = g.c(i);
    const grad = ctx.createLinearGradient(0, 0, 0, th);
    grad.addColorStop(0, rgba(col, 0)); grad.addColorStop(.55, rgba(col, .55));
    grad.addColorStop(.78, rgba(col, .2)); grad.addColorStop(1, rgba(col, 0));
    return { y: h * rng.range(.2, .65), amp: h * rng.range(.08, .18), th, f: rng.range(.8, 2), sp: rng.range(.06, .16), ph: rng() * 100, grad };
  });
  return t => {
    ctx.save(); ctx.globalCompositeOperation = 'screen';
    for (const b of bands) {
      ctx.fillStyle = b.grad;
      for (let k = 0; k < steps; k++) {
        const x = k / steps;
        const y = b.y + noise(x * b.f, b.ph, t * b.sp) * b.amp * 2 + Math.sin(x * Math.PI * b.f + t * b.sp * 4 + b.ph) * b.amp * .6;
        ctx.globalAlpha = clamp(.45 + 1.1 * noise(x * 4, b.ph + 5, t * b.sp * 3), 0, 1) * clamp(.65 + .8 * noise(x * 16, b.ph + 9, t * .4), 0, 1);
        const x0 = Math.round(k * sw), x1 = Math.round((k + 1) * sw);
        ctx.setTransform(1, 0, 0, 1, x0, y - b.th * .5);
        ctx.fillRect(0, 0, x1 - x0, b.th);
      }
    }
    ctx.restore();
  };
}};

GEN.blobs = { name: 'Floating Blobs', make(g) {
  const { ctx, w, h, rng, p } = g, m = Math.min(w, h);
  const bl = Array.from({ length: Math.round(4 + 4 * p.density) }, (_, i) => ({
    cx: w * rng(), cy: h * rng(), r: m * rng.range(.3, .6), ax: w * rng.range(.1, .3), ay: h * rng.range(.1, .3),
    fx: rng.range(.1, .25), fy: rng.range(.1, .25), ph: rng() * TAU, col: g.c(i) }));
  return t => {
    ctx.save(); ctx.globalCompositeOperation = 'screen';
    for (const b of bl) {
      const x = b.cx + Math.sin(t * b.fx + b.ph) * b.ax, y = b.cy + Math.cos(t * b.fy + b.ph * 1.7) * b.ay;
      const r = b.r * (1 + .12 * Math.sin(t * .3 + b.ph));
      const gr = ctx.createRadialGradient(x, y, 0, x, y, r);
      gr.addColorStop(0, rgba(b.col, .7)); gr.addColorStop(.45, rgba(b.col, .3)); gr.addColorStop(1, rgba(b.col, 0));
      ctx.fillStyle = gr; ctx.fillRect(x - r, y - r, 2 * r, 2 * r);
    }
    ctx.restore();
  };
}};

GEN.particles = { name: 'Particle Flow', make(g) {
  const { ctx, w, h, s, rng, p } = g, N = Math.round(110 * p.density), M = 40 * s;
  const pts = Array.from({ length: N }, () => ({ x: rng() * (w + 2 * M), y: rng() * (h + 2 * M), vx: rng.range(-30, 30) * s, vy: rng.range(-30, 30) * s, r: rng.range(1.2, 3) * s, c: rng.int(0, 2) }));
  const D = Math.min(w, h) * .16, D2 = D * D, xs = new Float32Array(N), ys = new Float32Array(N);
  return t => {
    for (let i = 0; i < N; i++) { const q = pts[i]; xs[i] = mod(q.x + q.vx * t, w + 2 * M) - M; ys[i] = mod(q.y + q.vy * t, h + 2 * M) - M; }
    const buckets = [[], [], [], [], []];
    for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++) {
      const dx = xs[i] - xs[j], dy = ys[i] - ys[j], d2 = dx * dx + dy * dy;
      if (d2 < D2) buckets[Math.min(4, Math.floor((1 - Math.sqrt(d2) / D) * 5))].push(i, j);
    }
    ctx.save(); ctx.lineWidth = 1.4 * s;
    buckets.forEach((b, k) => {
      if (!b.length) return; ctx.beginPath();
      for (let q = 0; q < b.length; q += 2) { ctx.moveTo(xs[b[q]], ys[b[q]]); ctx.lineTo(xs[b[q + 1]], ys[b[q + 1]]); }
      ctx.strokeStyle = rgba(g.c(0), (k + 1) / 5 * .75); g.stroke();
    });
    for (let c = 0; c < 3; c++) {
      ctx.beginPath();
      for (let i = 0; i < N; i++) if (pts[i].c === c) { ctx.moveTo(xs[i] + pts[i].r, ys[i]); ctx.arc(xs[i], ys[i], pts[i].r, 0, TAU); }
      ctx.fillStyle = rgba(g.c(c + 1), .95); ctx.fill();
      if (p.glow) { ctx.beginPath(); for (let i = 0; i < N; i++) if (pts[i].c === c) { ctx.moveTo(xs[i] + pts[i].r * 4, ys[i]); ctx.arc(xs[i], ys[i], pts[i].r * 4, 0, TAU); } ctx.fillStyle = rgba(g.c(c + 1), .12); ctx.fill(); }
    }
    ctx.restore();
  };
}};

GEN.hex = { name: 'Hex Grid Pulse', make(g) {
  const { ctx, w, h, s, rng, noise, p } = g;
  const R = 46 * s / Math.sqrt(p.density), dx = Math.sqrt(3) * R, dy = 1.5 * R;
  const cells = [];
  for (let row = -1; row * dy < h + R; row++) for (let col = -1; col * dx < w + dx; col++) cells.push({ x: col * dx + (row & 1 ? dx / 2 : 0), y: row * dy, row, col });
  const hexPath = new Path2D();
  for (let k = 0; k <= 6; k++) { const a = TAU * k / 6 + Math.PI / 6; hexPath[k ? 'lineTo' : 'moveTo'](Math.cos(a) * R * .9, Math.sin(a) * R * .9); }
  const all = new Path2D(); for (const c of cells) all.addPath(hexPath, new DOMMatrix([1, 0, 0, 1, c.x, c.y]));
  const centers = Array.from({ length: 3 }, (_, i) => ({ x: w * rng(), y: h * rng(), k: rng.range(.8, 1.4), ph: rng() * TAU, c: g.c(i) }));
  return t => {

GEN.landscape = { name: 'Wireframe Landscape', make(g) {
  const { w, h, s, rng, noise, p } = g;
  const { buf, bctx } = g.buffer();
  const cols = Math.round(40 + 20 * p.density), rows = Math.round(28 + 14 * p.density);
  const X = 14 * Math.max(1, w / h), zN = 1.2, zF = 26, dz = (zF - zN) / rows, f = h * .85, hor = h * .4, camH = 1.6, ox = rng() * 100;
  const xw = Array.from({ length: cols + 1 }, (_, i) => -X + 2 * X * i / cols);
  const hgt = (x, z) => { const n = noise(x * .18 + ox, z * .18) + noise(x * .5 + ox, z * .5, 3.3) * .35; return Math.max(0, n + .25) * 3.4 * Math.min(1, Math.abs(x) / 3 + .15); };

  const glow = bctx.createLinearGradient(0, hor - h * .3, 0, hor + h * .05);
  glow.addColorStop(0, rgba(g.c(2), 0)); glow.addColorStop(.8, rgba(g.c(2), .22)); glow.addColorStop(1, rgba(g.c(2), 0));

    const travel = t * 1.8, off = mod(travel, dz);
    for (let r = 0; r <= rows; r++) {
      const z = zN + r * dz - off, wz = z + travel, row = P[r];
      for (let c = 0; c <= cols; c++) { row[c * 2] = w / 2 + xw[c] * f / z; row[c * 2 + 1] = hor + (camH - hgt(xw[c], wz)) * f / z; }

      for (let c = 0; c <= cols; c++) bctx.lineTo(row[c * 2], row[c * 2 + 1]);
      bctx.lineTo(row[cols * 2], h + 10); bctx.closePath(); bctx.fillStyle = '#000'; bctx.fill();
      bctx.globalCompositeOperation = 'source-over';

GEN.orbit = { name: 'Orbit Rings', make(g) {

GEN.geometric = { name: 'Geometric Drift', make(g) {
  const { ctx, w, h, s, rng, p } = g, M = 130 * s;

GEN.grain = { name: 'Gradient Noise', make(g) {
  const { ctx, w, h, rng, p } = g, D = Math.hypot(w, h), a0 = rng() * TAU;
  return t => {
    const a = a0 + t * .15, cx = w / 2 + Math.cos(t * .2) * w * .15, cy = h / 2 + Math.sin(t * .17) * h * .15;
    const gr = ctx.createLinearGradient(cx - Math.cos(a) * D / 2, cy - Math.sin(a) * D / 2, cx + Math.cos(a) * D / 2, cy + Math.sin(a) * D / 2);
    gr.addColorStop(0, rgba(g.c(0), .9)); gr.addColorStop(.5 + .2 * Math.sin(t * .4), rgba(g.c(1), .7)); gr.addColorStop(1, rgba(g.c(2), .9));
    ctx.save(); ctx.fillStyle = gr; ctx.fillRect(0, 0, w, h);

    ctx.restore();
  };
}};

GEN.rays = { name: 'Light Rays', make(g) {
  const { ctx, w, h, s, rng, p } = g;
  const sx = w * rng.range(.2, .8), sy = -h * rng.range(.1, .3), L = Math.hypot(w, h) * 1.4;

  const motes = Array.from({ length: Math.round(60 * p.density) }, () => ({ x: rng() * w, y: rng() * h, vx: rng.range(-6, 6) * s, vy: rng.range(-12, 4) * s, r: rng.range(.8, 2.4) * s, ph: rng() * TAU }));

GEN.matrix = { name: 'Matrix Streams', make(g) {
  const { ctx, w, h, s, rng, p } = g;
  const cell = 24 * s / Math.sqrt(p.density), cols = Math.ceil(w / cell), rowsN = Math.ceil(h / cell) + 1;
  const CH = '0123456789ABCDEF<>/|=+*:;#$%&{}[]'.split('');
  const st = Array.from({ length: cols }, () => ({ sp: rng.range(5, 18), len: rng.int(8, 30), off: rng() * 100, col: g.c(rng.int(0, 2)), rate: rng.range(2, 8) }));
  return t => {
    ctx.save(); ctx.font = `${Math.round(cell * .85)}px Consolas, "Courier New", monospace`; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    if (p.glow) { ctx.shadowColor = 'transparent'; }

      for (let k = 0; k <= S.len; k++) {

    ctx.restore();

GEN.flowfield = { name: 'Flow Field', make(g) {
  const { w, h, s, p, noise } = g, rng = makeRng(g.seed ^ 0xabc);
  const { buf, bctx } = g.buffer();
  const N = Math.min(1500, Math.round(600 * p.density)), DT = 1 / 60, sc = .0022 / s, V = 70 * s;
  let pts, simT;
  const spawn = q => { q.x = rng() * w; q.y = rng() * h; q.life = rng.range(2, 8); return q; };
  const reset = () => { bctx.clearRect(0, 0, w, h); pts = Array.from({ length: N }, (_, i) => spawn({ c: i % 4 })); simT = -3; };
  const step = () => {
    bctx.globalCompositeOperation = 'destination-out'; bctx.fillStyle = 'rgba(0,0,0,.045)'; bctx.fillRect(0, 0, w, h);
    bctx.globalCompositeOperation = 'source-over'; bctx.lineWidth = 1.6 * s; bctx.lineCap = 'round';
    for (let c = 0; c < 4; c++) {
      bctx.beginPath();
      for (const q of pts) {
        if (q.c !== c) continue;
        const a = noise(q.x * sc, q.y * sc, simT * .08) * TAU * 2.2;
        const nx = q.x + Math.cos(a) * V * DT, ny = q.y + Math.sin(a) * V * DT;
        bctx.moveTo(q.x, q.y); bctx.lineTo(nx, ny); q.x = nx; q.y = ny; q.life -= DT;
        if (q.life < 0 || nx < -5 || ny < -5 || nx > w + 5 || ny > h + 5) spawn(q);
      }
      bctx.strokeStyle = rgba(g.c(c), .85); bctx.stroke();
    }
    simT += DT;
  };
  reset();
  return t => {
    if (t < simT - DT * 2) reset();
    if (t - simT > 12) { reset(); simT = t - 3; }
    while (simT + DT <= t) step();
    g.ctx.save(); g.ctx.globalCompositeOperation = p.glow ? 'lighter' : 'source-over'; g.ctx.drawImage(buf, 0, 0); g.ctx.restore();
  };
}};

GEN.mesh = { name: 'Liquid Mesh', make(g) {
  const { ctx, w, h, rng, p, pal } = g;
  const lw = 96, lh = Math.max(8, Math.round(96 * h / w));
  const off = document.createElement('canvas'); off.width = lw; off.height = lh;
  const octx = off.getContext('2d'), img = octx.createImageData(lw, lh), asp = w / h;
  const K = Math.round(4 + 3 * p.density);
  const cols = [...Array.from({ length: K }, (_, i) => pal.rgb[i % pal.rgb.length]), pal.bgRgb[0], pal.bgRgb[1]];
  const pts = cols.map(rgb => ({ x: rng(), y: rng(), ax: rng.range(.15, .4), ay: rng.range(.15, .4), fx: rng.range(.08, .2), fy: rng.range(.08, .2), ph: rng() * TAU, rgb }));
  const P = pts.length, px = new Float32Array(P), py = new Float32Array(P);
  return t => {
    for (let i = 0; i < P; i++) { const q = pts[i]; px[i] = (q.x + Math.sin(t * q.fx + q.ph) * q.ax) * asp; py[i] = q.y + Math.cos(t * q.fy + q.ph * 1.3) * q.ay; }
    const d = img.data;
    for (let y = 0; y < lh; y++) for (let x = 0; x < lw; x++) {
      const nx = x / (lw - 1) * asp, ny = y / (lh - 1); let r = 0, gg = 0, b = 0, ws = 0;
      for (let i = 0; i < P; i++) { const dx = nx - px[i], dy = ny - py[i]; const wt = 1 / Math.pow(dx * dx + dy * dy + .015, 1.6); ws += wt; r += pts[i].rgb[0] * wt; gg += pts[i].rgb[1] * wt; b += pts[i].rgb[2] * wt; }
      const o = (y * lw + x) * 4; d[o] = r / ws; d[o + 1] = gg / ws; d[o + 2] = b / ws; d[o + 3] = 255;
    }

  };
}};

GEN.waves = { name: 'Wave Bands', make(g) {
  const { ctx, w, h, s, rng, p, pal } = g, L = Math.round(4 + 3 * p.density), steps = 90;
  const layers = Array.from({ length: L }, (_, i) => {
    const base = h * (.3 + .62 * i / L), a1 = h * rng.range(.03, .08), col = g.c(i);
    const gr = ctx.createLinearGradient(0, base - a1 * 2, 0, h);
    gr.addColorStop(0, rgba(col, .8)); gr.addColorStop(1, rgba(mixHex(col, pal.bg[0], .75), .95));
    return { base, a1, f1: rng.range(1, 2.5), v1: rng.range(.2, .5), a2: h * rng.range(.01, .035), f2: rng.range(3, 6), v2: rng.range(-.6, .6), ph: rng() * TAU, col, gr };
  });
  const ys = new Float32Array(steps + 1);
  return t => {
    ctx.save(); ctx.lineWidth = 2 * s;
    for (const l of layers) {
      for (let k = 0; k <= steps; k++) { const x = k / steps; ys[k] = l.base + l.a1 * Math.sin(x * TAU * l.f1 + t * l.v1 + l.ph) + l.a2 * Math.sin(x * TAU * l.f2 + t * l.v2 + l.ph * 2); }

      for (let k = 0; k <= steps; k++) ctx.lineTo(k / steps * w, ys[k]);
      ctx.lineTo(w, h); ctx.closePath(); ctx.fillStyle = l.gr; ctx.fill();
      ctx.beginPath(); for (let k = 0; k <= steps; k++) ctx[k ? 'lineTo' : 'moveTo'](k / steps * w, ys[k]);
      ctx.strokeStyle = rgba(mixHex(l.col, '#ffffff', .4), .6); g.stroke();
    }
    ctx.restore();
  };
}};

GEN.starfield = { name: 'Starfield', make(g) {
  const { ctx, w, h, s, rng, p } = g, a = Math.PI + rng.range(-.3, .3), V = 80 * s;
  const stars = Array.from({ length: Math.round(500 * p.density) }, () => ({ x: rng() * w, y: rng() * h, z: rng() ** 2 * .9 + .1, sz: rng.range(.6, 2.2), ph: rng() * TAU, tw: rng.range(.5, 3), col: rng() < .2 ? g.c(rng.int(0, 4)) : '#ffffff' }));
  const neb = Array.from({ length: 3 }, (_, i) => ({ x: rng() * w, y: rng() * h, r: Math.max(w, h) * rng.range(.3, .55), col: g.c(i), ph: rng() * TAU }));
  return t => {
    ctx.save();
    for (const n of neb) {
      const x = n.x + Math.sin(t * .03 + n.ph) * w * .05, y = n.y + Math.cos(t * .025 + n.ph) * h * .05;
      const gr = ctx.createRadialGradient(x, y, 0, x, y, n.r); gr.addColorStop(0, rgba(n.col, .16)); gr.addColorStop(1, rgba(n.col, 0));
      ctx.fillStyle = gr; ctx.fillRect(x - n.r, y - n.r, n.r * 2, n.r * 2);
    }
    for (const q of stars) {
      const x = mod(q.x + Math.cos(a) * V * q.z * t, w), y = mod(q.y + Math.sin(a) * V * q.z * t, h), r = q.sz * q.z * s * 1.6;
      const al = q.z * (.55 + .45 * Math.sin(t * q.tw + q.ph));
      if (p.glow && q.z > .7) { ctx.fillStyle = rgba(q.col, al * .12); ctx.beginPath(); ctx.arc(x, y, r * 4, 0, TAU); ctx.fill(); }
      ctx.fillStyle = rgba(q.col, al);
      if (r < 1.2) ctx.fillRect(x - r, y - r, r * 2, r * 2); else { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); }
    }
    ctx.restore();
  };
}};

GEN.lines = { name: 'Abstract Lines', make(g) {
  const { ctx, w, h, s, rng, p } = g, N = Math.round(18 + 18 * p.density), steps = 80;
  const bundles = Array.from({ length: rng.int(1, 2) }, (_, b) => {
    const gr = ctx.createLinearGradient(0, 0, w, 0); gr.addColorStop(0, rgba(g.c(b * 2), .9)); gr.addColorStop(1, rgba(g.c(b * 2 + 1), .9));
    return { cy: h * rng.range(.3, .7), spread: h * rng.range(.15, .35), A: h * rng.range(.08, .2), f1: rng.range(.5, 1.5), f2: rng.range(1.5, 3), v: rng.range(.15, .4), ph: rng() * 10, tilt: rng.range(-.15, .15) * h, gr };
  });

    ctx.save(); ctx.lineWidth = 1.2 * s;

      for (let i = 0; i < N; i++) {
        const u = i / (N - 1) - .5; ctx.beginPath();
        for (let k = 0; k <= steps; k++) {

        }
        ctx.globalAlpha = .25 + .55 * (1 - Math.abs(u) * 2); g.stroke();
      }
    }
    ctx.restore();
  };
}};

GEN.mosaic = { name: 'Mosaic Tiles', make(g) {
  const { ctx, w, h, s, noise, p, pal } = g;
  const cell = 64 * s / Math.sqrt(p.density), cols = Math.ceil(w / cell), rows = Math.ceil(h / cell), gap = Math.max(1, 2 * s);

GEN.pulse = { name: 'Pulse Circles', make(g) {
  const { ctx, w, h, s, rng, p } = g, maxR = Math.hypot(w, h) * .6, R = 6;
  const em = Array.from({ length: 2 + Math.round(p.density * 2) }, (_, i) => ({ x: w * rng.range(.15, .85), y: h * rng.range(.15, .85), sp: rng.range(.08, .16), col: g.c(i), ph: rng() * TAU }));

GEN.ribbons = { name: 'Ribbon Paths', make(g) {
  const { ctx, w, h, s, rng, p } = g, strands = 28, steps = 90;
  const rib = Array.from({ length: 1 + Math.round(p.density * 1.5) }, (_, i) => ({
    cy: h * rng.range(.25, .75), A: h * rng.range(.1, .22), f: rng.range(.5, 1.2), v: rng.range(.15, .35), W: h * rng.range(.05, .12),

GEN.digital = { name: 'Digital Grid', make(g) {
  const { ctx, w, h, s, rng, p } = g;
  const cell = 72 * s / Math.sqrt(p.density), cols = Math.ceil(w / cell) + 1, rows = Math.ceil(h / cell) + 1;
  const ox = (w - (cols - 1) * cell) / 2, oy = (h - (rows - 1) * cell) / 2;
  const grid = new Path2D();
  for (let c = 0; c < cols; c++) { grid.moveTo(ox + c * cell, 0); grid.lineTo(ox + c * cell, h); }
  for (let r = 0; r < rows; r++) { grid.moveTo(0, oy + r * cell); grid.lineTo(w, oy + r * cell); }
  const nodes = Array.from({ length: 50 }, () => ({ c: rng.int(0, cols - 1), r: rng.int(0, rows - 1), sp: rng.range(.3, 1.2), ph: rng() * TAU, col: g.c(rng.int(0, 2)) }));
  const pk = Array.from({ length: Math.round(26 * p.density) + 6 }, (_, i) => {
    const horiz = rng() < .5;
    return { horiz, line: horiz ? rng.int(0, rows - 1) : rng.int(0, cols - 1), sp: rng.range(1.5, 5) * cell, dir: rng() < .5 ? -1 : 1, len: rng.range(1.5, 4) * cell, off: rng() * 5000 * s, col: g.c(i % 3) };
  });

    ctx.save(); ctx.lineWidth = s; ctx.strokeStyle = rgba(g.c(0), .15); ctx.stroke(grid);
    const sy = mod(t * h * .12, h * 1.4) - h * .2, band = ctx.createLinearGradient(0, sy - h * .12, 0, sy + h * .12);
    band.addColorStop(0, rgba(g.c(1), 0)); band.addColorStop(.5, rgba(g.c(1), .07)); band.addColorStop(1, rgba(g.c(1), 0));
    ctx.fillStyle = band; ctx.fillRect(0, sy - h * .12, w, h * .24);

      const a = Math.max(0, Math.sin(t * n.sp + n.ph)) ** 6; if (a < .02) continue;
      const x = ox + n.c * cell, y = oy + n.r * cell, sz = 5 * s;
      ctx.fillStyle = rgba(n.col, a); ctx.fillRect(x - sz, y - sz, sz * 2, sz * 2);
      ctx.strokeStyle = rgba(n.col, a * .5); ctx.strokeRect(x - sz * 2.5, y - sz * 2.5, sz * 5, sz * 5);
    }
    ctx.lineWidth = 2 * s; ctx.lineCap = 'round';
    for (const q of pk) {
      const span = (q.horiz ? w : h) + q.len * 2, pos = mod(q.off + q.sp * q.dir * t, span) - q.len, tail = pos - q.dir * q.len;
      const fixed = q.horiz ? oy + q.line * cell : ox + q.line * cell;
      const [x1, y1, x2, y2] = q.horiz ? [tail, fixed, pos, fixed] : [fixed, tail, fixed, pos];
      const gr = ctx.createLinearGradient(x1, y1, x2, y2); gr.addColorStop(0, rgba(q.col, 0)); gr.addColorStop(1, rgba(q.col, .95));
      ctx.strokeStyle = gr; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); g.stroke();
      ctx.fillStyle = '#ffffff'; ctx.fillRect(x2 - 2 * s, y2 - 2 * s, 4 * s, 4 * s);
    }
    ctx.restore();
  };
}};

const TYPE_KEYS = Object.keys(GEN);
const BLENDS = ['source-over', 'screen', 'lighter', 'overlay', 'soft-light'];

// ============================================================ seed engine
const randSeed = () => (Math.random() * 2 ** 31) >>> 0;
const DEFAULT_PARAMS = { speed: 1, density: 1, glow: false, grain: .12, vignette: .35 };

function makeChaos(seed, palette) {
  const r = makeRng(seed);
  const n = r.int(1, 3), pool = [...TYPE_KEYS], layers = [];
  for (let i = 0; i < n; i++) {
    const type = pool.splice(Math.floor(r() * pool.length), 1)[0];
    layers.push({ type, seed: Math.floor(r() * 2 ** 31), blend: i === 0 ? 'source-over' : r.pick(BLENDS.slice(1)), opacity: +(i === 0 ? 1 : r.range(.45, 1)).toFixed(2),
      params: { speed: +r.range(.4, 1.6).toFixed(2), density: +r.range(.4, 1.8).toFixed(2) } });
  }
  if (!palette) {
    const modes = ['theme', 'theme', 'single', 'dual', 'triadic', 'analogous', 'complementary'];
    const mode = r.pick(modes);
    palette = { mode, theme: r.pick(Object.keys(THEMES)), hue: r.int(0, 359), hue2: r.int(0, 359), custom: [] };
  }
  return { version: 1, type: 'chaos', seed, palette: structuredClone(palette),
    params: { speed: 1, density: 1, glow: r() < .4, grain: +r.range(0, .45).toFixed(2), vignette: +r.range(.15, .7).toFixed(2) }, layers };
}

// ============================================================ renderer
function makeGrainTiles(seed) {
  const r = mulberry32(seed ^ 0x51ed), tiles = [];
  for (let k = 0; k < 6; k++) {
    const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d'), im = x.createImageData(256, 256);
    for (let i = 0; i < im.data.length; i += 4) { const v = (r() * 255) | 0; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
    x.putImageData(im, 0, 0); tiles.push(c);
  }
  return tiles;
}

function createRenderer(canvas, cfg) {
  const ctx = canvas.getContext('2d'), w = canvas.width, h = canvas.height, s = Math.min(w, h) / 1080;
  const pal = buildPalette(cfg.palette), nc = pal.colors.length;
  const base = { ...DEFAULT_PARAMS, ...cfg.params };
  const tiles = makeGrainTiles(cfg.seed ?? 1);
  const drawGrain = (c, t, amount) => {
    const f = Math.floor(t * 24), tile = tiles[mod(f, tiles.length)];
    const pat = c.createPattern(tile, 'repeat'), sc = Math.max(.5, s);
    pat.setTransform(new DOMMatrix().translate(hash3(f, 1, 2) % 256, hash3(f, 3, 4) % 256).scale(sc));
    c.save(); c.globalCompositeOperation = 'overlay'; c.globalAlpha = amount; c.fillStyle = pat; c.fillRect(0, 0, w, h); c.restore();
  };
  const isChaos = cfg.type === 'chaos';
  const defs = isChaos ? (cfg.layers || []) : [{ type: cfg.type, seed: cfg.seed, blend: 'source-over', opacity: 1, params: {} }];
  const layers = defs.filter(L => GEN[L.type]).map(L => {
    const p = { ...base, ...(L.params || {}) };
    let lctx = ctx, lc = null;
    if (isChaos) { lc = document.createElement('canvas'); lc.width = w; lc.height = h; lctx = lc.getContext('2d'); }
    const g = {
      ctx: lctx, w, h, s, p, pal, seed: L.seed >>> 0, rng: makeRng(L.seed), noise: makeNoise(L.seed),
      c: i => pal.colors[mod(i, nc)], drawGrain,
      buffer() { const buf = document.createElement('canvas'); buf.width = w; buf.height = h; return { buf, bctx: buf.getContext('2d') }; },
      stroke(path, c = lctx) {
        if (p.glow) { c.save(); c.lineWidth *= 5; c.globalAlpha *= .14; c.globalCompositeOperation = 'lighter'; path ? c.stroke(path) : c.stroke(); c.restore(); }
        path ? c.stroke(path) : c.stroke();
      },
    };
    return { draw: GEN[L.type].make(g), lc, lctx, blend: L.blend || 'source-over', opacity: L.opacity ?? 1, speed: p.speed };
  });
  const bgA = makeRng((cfg.seed ?? 1) ^ 0x77)() * TAU, D = Math.hypot(w, h) / 2;
  const bgGrad = ctx.createLinearGradient(w / 2 - Math.cos(bgA) * D, h / 2 - Math.sin(bgA) * D, w / 2 + Math.cos(bgA) * D, h / 2 + Math.sin(bgA) * D);
  bgGrad.addColorStop(0, pal.bg[0]); bgGrad.addColorStop(1, pal.bg[1]);
  const vig = ctx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * .25, w / 2, h / 2, Math.hypot(w, h) * .62);
  vig.addColorStop(0, 'rgba(0,0,0,0)'); vig.addColorStop(1, `rgba(0,0,0,${base.vignette})`);
  return {
    w, h, pal,
    render(t) {
      ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, w, h);
      for (const L of layers) {
        if (L.lc) {
          L.lctx.setTransform(1, 0, 0, 1, 0, 0); L.lctx.clearRect(0, 0, w, h); L.draw(t * L.speed);
          ctx.save(); ctx.globalCompositeOperation = L.blend; ctx.globalAlpha = L.opacity; ctx.drawImage(L.lc, 0, 0); ctx.restore();
        } else L.draw(t * L.speed);
      }
      ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
      if (base.vignette > 0) { ctx.fillStyle = vig; ctx.fillRect(0, 0, w, h); }
      if (base.grain > 0) drawGrain(ctx, t, base.grain * .5);
    },
  };
}

// ============================================================ UI state
const $ = id => document.getElementById(id);
let cfg = { version: 1, type: 'aurora', seed: 1337, palette: { mode: 'theme', theme: 'cyberpunk', hue: 265, hue2: 320, custom: [] }, params: { ...DEFAULT_PARAMS } };
const ASPECTS = { '16:9': [16, 9], '9:16': [9, 16], '1:1': [1, 1], '4:5': [4, 5], '21:9': [21, 9] };

function outputSize() {
  const a = $('aspect').value, q = $('quality').value;
  if (a === 'custom' || q === 'custom') return { w: Math.max(64, (+$('cw').value >> 1) << 1), h: Math.max(64, (+$('ch').value >> 1) << 1) };
  const [x, y] = ASPECTS[a], sh = +q, even = v => Math.round(v / 2) * 2;
  return x >= y ? { w: even(sh * x / y), h: sh } : { w: sh, h: even(sh * y / x) };
}
function updateDims() {
  const custom = $('aspect').value === 'custom' || $('quality').value === 'custom';
  if (custom && !$('cw').value) { const o = outputSize.call(null); }
  $('customDims').classList.toggle('hidden', !custom);
  if (!custom) { const { w, h } = outputSize(); $('cw').value = w; $('ch').value = h; }
  const { w, h } = outputSize(); $('dims').textContent = `${w} × ${h} px`;
  for (const o of $('quality').options) if (o.value !== 'custom') {
    const a = $('aspect').value; if (a === 'custom') { o.textContent = { 1080: '1080p', 1440: '1440p', 2160: '4K' }[o.value]; continue; }
    const [x, y] = ASPECTS[a], sh = +o.value, W = x >= y ? Math.round(sh * x / y / 2) * 2 : sh, H = x >= y ? sh : Math.round(sh * y / x / 2) * 2;
    o.textContent = `${{ 1080: '1080p', 1440: '1440p', 2160: '4K' }[o.value]} (${W}×${H})`;
  }
}

// preview canvas + renderer
const pv = $('preview');
let renderer = null, time = 0, playing = true;
function buildPreview() {
  const { w, h } = outputSize(), k = Math.min(1, 1280 / Math.max(w, h));
  pv.width = Math.round(w * k); pv.height = Math.round(h * k);
  fitPreview();
  try { renderer = createRenderer(pv, cfg); } catch (e) { console.error(e); }
}
function fitPreview() {
  const st = $('stage'), aw = st.clientWidth - 48, ah = st.clientHeight - 48, r = Math.min(aw / pv.width, ah / pv.height);
  pv.style.width = Math.floor(pv.width * r) + 'px'; pv.style.height = Math.floor(pv.height * r) + 'px';
}
new ResizeObserver(fitPreview).observe($('stage'));

let last = performance.now(), lastDraw = 0, frames = 0, fpsT = 0, fps = 0;
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(.25, (now - last) / 1000); last = now;
  if (playing) time += dt;
  if (now - lastDraw < 1000 / 31) return;
  lastDraw = now;
  const t0 = performance.now(); renderer && renderer.render(time); const ms = performance.now() - t0;
  frames++; if (now - fpsT > 1000) { fps = frames * 1000 / (now - fpsT); frames = 0; fpsT = now; }
  $('meta').textContent = `t ${time.toFixed(1)}s · preview ${pv.width}×${pv.height} · ${fps.toFixed(0)} fps · ${ms.toFixed(1)} ms/frame`;
}
requestAnimationFrame(loop);

// type buttons with live thumbnails

  return null;
}

async function exportVideo(kind, w, h, fps, total, cv, r, name) {
  if (!('VideoEncoder' in window)) throw new Error('WebCodecs not available — use a recent Chrome or Edge.');
  const bitrate = Math.round(clamp(w * h * fps * .12, 4e6, 80e6));
  let muxer, config;
  if (kind === 'mp4') {
    const M = await import('https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.2/+esm');
    config = await pickCodec(['avc1.640034', 'avc1.640033', 'avc1.640032', 'avc1.640028', 'avc1.4d0034', 'avc1.42003e'], w, h, fps, bitrate);
    if (!config) throw new Error(`No H.264 encoder supports ${w}×${h}@${fps}. Try WebM or a smaller size.`);
    muxer = new M.Muxer({ target: new M.ArrayBufferTarget(), video: { codec: 'avc', width: w, height: h, frameRate: fps }, fastStart: 'in-memory' });
  } else {
    const M = await import('https://cdn.jsdelivr.net/npm/webm-muxer@5.1.4/+esm');
    config = await pickCodec(['vp09.00.51.08', 'vp09.00.41.08', 'vp09.00.31.08', 'vp8'], w, h, fps, bitrate);
    if (!config) throw new Error(`No VP9 encoder supports ${w}×${h}@${fps}.`);
    muxer = new M.Muxer({ target: new M.ArrayBufferTarget(), video: { codec: config.codec === 'vp8' ? 'V_VP8' : 'V_VP9', width: w, height: h, frameRate: fps } });
  }
  let encErr = null;
  const enc = new VideoEncoder({ output: (chunk, meta) => muxer.addVideoChunk(chunk, meta), error: e => encErr = e });
  enc.configure(config);
  const t0 = performance.now(); let lastUI = 0;
  for (let i = 0; i < total; i++) {
    if (cancelFlag) { enc.close(); throw new Error('Cancelled.'); }
    if (encErr) throw encErr;
    r.render(i / fps);
    const fr = new VideoFrame(cv, { timestamp: Math.round(i * 1e6 / fps), duration: Math.round(1e6 / fps) });
    enc.encode(fr, { keyFrame: i % (fps * 2) === 0 }); fr.close();
    while (enc.encodeQueueSize > 6) await new Promise(res => enc.addEventListener('dequeue', res, { once: true }));
    if (performance.now() - lastUI > 120 || i === total - 1) { lastUI = performance.now(); const el = (performance.now() - t0) / 1000, rate = (i + 1) / el; progress((i + 1) / total);
      status(`Frame ${i + 1}/${total} · ${rate.toFixed(1)} fps · ETA ${((total - i - 1) / rate).toFixed(0)}s · ${config.codec}`); await yieldUI(); }
  }
  await enc.flush(); enc.close(); muxer.finalize();
  const blob = new Blob([muxer.target.buffer], { type: kind === 'mp4' ? 'video/mp4' : 'video/webm' });
  download(blob, `${name}.${kind}`);
  return blob.size;
}

async function exportPngSeq(w, h, fps, total, cv, r, name) {
  const estGB = total * w * h * 1.6 / 1e9;
  if (estGB > 1.5 && !confirm(`This will be roughly ${estGB.toFixed(1)} GB of PNGs held in memory. Continue?`)) throw new Error('Cancelled.');
  if (!window.JSZip) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');
  const zip = new JSZip(), pad = String(total).length;
  for (let i = 0; i < total; i++) {
    if (cancelFlag) throw new Error('Cancelled.');
    r.render(i / fps);
    zip.file(`${name}_${String(i).padStart(Math.max(5, pad), '0')}.png`, await new Promise(res => cv.toBlob(res, 'image/png')));
    progress((i + 1) / total * .9); status(`Frame ${i + 1}/${total}`);
  }
  status('Zipping…');
  const blob = await zip.generateAsync({ type: 'blob', compression: 'STORE' }, m => progress(.9 + m.percent / 1000));
  download(blob, `${name}_png.zip`); return blob.size;
}

$('render').onclick = async () => {
  const { w, h } = outputSize(), fps = +$('fps').value, dur = clamp(+$('dur').value || 10, 1, 600), total = Math.round(fps * dur), kind = $('fmt').value;
  const name = `backdrop_${cfg.type}_${cfg.seed}_${w}x${h}`;
  cancelFlag = false; $('render').disabled = true; $('cancel').disabled = false; progress(0); status('Preparing…');
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const t0 = performance.now();
  try {
    const r = createRenderer(cv, cfg); let size;
    if (kind === 'png') { r.render(time); const b = await new Promise(res => cv.toBlob(res, 'image/png')); download(b, `${name}_t${time.toFixed(2)}.png`); size = b.size; progress(1); }
    else if (kind === 'png-seq') size = await exportPngSeq(w, h, fps, total, cv, r, name);
    else size = await exportVideo(kind, w, h, fps, total, cv, r, name);
    status(`Done in ${((performance.now() - t0) / 1000).toFixed(1)}s · ${(size / 1e6).toFixed(1)} MB`);
    progress(1);
  } catch (e) { console.error(e); status(e.message || String(e)); progress(0); }
  finally { $('render').disabled = false; $('cancel').disabled = true; }
};
$('cancel').onclick = () => { cancelFlag = true; };

// expose for debugging / automation
window.backdrop = { GEN, createRenderer, makeChaos, get cfg() { return cfg; } };

// boot
updateDims(); commit();
</script>
